[pytest]
testpaths = tests
pythonpath = .
addopts = -ra --tb=short
markers =
    tc(id): ID тест-кейса з docs/test_cases.md (для автозапису результатів у docs/results.json)
    unit: перевірка самого фреймворку, без DUT
    smoke: базова готовність пристрою
    functional: функціональні перевірки
    boundary: граничні значення (BVA)
    persistence: збереження після reboot / OTA
    ota: OTA-сценарії
    slow: тест триває понад ~30 с (блокування 30 с, таймінги health тощо)
    since_2_3_0: тест лише для прошивки >= 2.3.0 (на 2.1.0 пропускається)
    only_2_1_0: тест лише для прошивки 2.1.0 (напр. перевірка E099)
