[env:nanoatmega328]
platform = atmelavr
board = nanoatmega328
framework = arduino
monitor_speed = 115200

[env:nanoatmega328old]
platform = atmelavr
board = nanoatmega328
framework = arduino
upload_speed = 57600
monitor_speed = 115200

[env:nanoatmega328avrdude8]
platform = atmelavr
# The board reports ATmega328P. This board entry is used only for the newer
# avrdude; -F accepts the actual 328P signature during upload.
board = ATmega328PB
framework = arduino
upload_protocol = arduino
upload_speed = 115200
upload_flags = -F
monitor_speed = 115200
